services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hartley
      POSTGRES_PASSWORD: hartley
      POSTGRES_DB: caravan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hartley -d caravan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
